name: Build Signed Android Release Bundle

# Manual only. Builds a signed, production release .aab using the release
# keystore stored in repo secrets (see generate-keystore.yml for how it was
# created). Always builds against the production OTA channel.
on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install web app dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web app
        run: npm run build
        env:
          VITE_OTA_CHANNEL: production
          VITE_R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android project with the fresh web build
        # APP_BUILD_VERSION (this commit's timestamp) is baked into the native
        # bundle's CapacitorUpdater version via capacitor.config.ts, so
        # src/lib/otaUpdater.ts can tell a genuinely newer OTA manifest from a
        # merely-different one instead of downgrading a fresh native build.
        run: APP_BUILD_VERSION=$(git log -1 --format=%ct) npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode release keystore
        working-directory: android/app
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore.jks

      - name: Build signed release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PATH: release.keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/release.keystore.jks

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: letthemeatcake-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
