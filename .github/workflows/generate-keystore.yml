name: Generate Release Keystore (one-time)

# Manual only. Generates a new Android release upload keystore using CI's JDK
# (this repo has no local JDK) and uploads it as a short-lived artifact so it
# can be downloaded once, stored as GitHub secrets, and backed up externally.
# Delete this workflow file after use — it should not be run twice against a
# real release keystore.
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Generate keystore + random passwords
        run: |
          STORE_PASS=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
          KEY_PASS=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
          ALIAS="letthemeatcake-release"

          keytool -genkeypair -v \
            -keystore release.keystore.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Let Them Eat Cake, OU=App, O=Millenial Muse Club, L=Unknown, ST=Unknown, C=US"

          {
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
          } > keystore-credentials.txt

      - name: Upload keystore + credentials artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-DOWNLOAD-AND-DELETE
          path: |
            release.keystore.jks
            keystore-credentials.txt
          retention-days: 1
