name: Generate Release Keystore (one-time)

# Manual only. Generates a new Android release upload keystore using CI's JDK
# (this repo has no local JDK) and uploads it as a short-lived artifact so it
# can be downloaded once, stored as GitHub secrets, and backed up externally.
# Delete this workflow file after use — it should not be run twice against a
# real release keystore.
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Generate keystore + random password
        run: |
          # Modern keytool (JDK 9+) creates PKCS12-format keystores by default
          # (even with a .jks filename), and PKCS12 does not support a key
          # password different from the store password — using two different
          # random passwords here previously caused "Given final block not
          # properly padded" when Gradle tried to sign with the wrong one.
          # Use one password for both, as PKCS12 requires.
          PASS=$(openssl rand -hex 24)
          ALIAS="letthemeatcake-release"

          keytool -genkeypair -v \
            -keystore release.keystore.jks \
            -storetype PKCS12 \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=Let Them Eat Cake, OU=App, O=Millenial Muse Club, L=Unknown, ST=Unknown, C=US"

          {
            echo "ANDROID_KEYSTORE_PASSWORD=$PASS"
            echo "ANDROID_KEY_PASSWORD=$PASS"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
          } > keystore-credentials.txt

          base64 -w0 release.keystore.jks > release.keystore.base64.txt
          sha256sum release.keystore.jks > release.keystore.jks.sha256

      - name: Upload keystore + credentials artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-DOWNLOAD-AND-DELETE
          path: |
            release.keystore.jks
            release.keystore.base64.txt
            release.keystore.jks.sha256
            keystore-credentials.txt
          retention-days: 1
