name: Publish OTA Update (Capgo)

# Manual only, on purpose — the app is entering App Store review, so no
# ordinary commit or push can ever trigger a production OTA release. Every
# publish (staging or production) requires a human to explicitly run this
# from the Actions tab and pick the channel.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Capgo channel to publish to"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  publish-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck + build (must pass before anything ships)
        run: npm run build

      - name: Publish bundle to Capgo
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: npx @capgo/cli@latest bundle upload --channel "${{ inputs.channel }}" --apikey "$CAPGO_TOKEN"
