name: Build Android APK

# Manual only — no push/pull_request triggers. Run from the Actions tab
# ("Run workflow") whenever you want a fresh debug APK.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build variant"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
      ota_channel:
        description: "OTA channel this build should poll (see OTA_UPDATES.md)"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install web app dependencies
        # react-simple-maps@3.0.0's peer-dep range caps at React 18 (stale
        # metadata, not a real incompatibility with React 19 — documented in
        # this repo's own memory/notes) — same workaround used locally.
        run: npm ci --legacy-peer-deps

      - name: Build web app
        run: npm run build
        env:
          VITE_OTA_CHANNEL: ${{ inputs.ota_channel }}
          VITE_R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}

      - name: Set up JDK 21
        # Capacitor's own generated capacitor-cordova-android-plugins module
        # sets sourceCompatibility/targetCompatibility to JavaVersion.VERSION_21
        # (android/capacitor-cordova-android-plugins/build.gradle) — JDK 17
        # fails with "invalid source release: 21" since javac can't target a
        # release newer than the JDK running it.
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android project with the fresh web build
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: letthemeatcake-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
