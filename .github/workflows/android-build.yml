name: Build Android APK

# Manual only — no push/pull_request triggers. Run from the Actions tab
# ("Run workflow") whenever you want a fresh debug APK.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build variant"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
      ota_channel:
        description: "OTA channel this build should poll (see OTA_UPDATES.md)"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install web app dependencies
        # react-simple-maps@3.0.0's peer-dep range caps at React 18 (stale
        # metadata, not a real incompatibility with React 19 — documented in
        # this repo's own memory/notes) — same workaround used locally.
        run: npm ci --legacy-peer-deps

      - name: Build web app
        run: npm run build
        env:
          VITE_OTA_CHANNEL: ${{ inputs.ota_channel }}
          VITE_R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}

      - name: Set up JDK 21
        # Capacitor's own generated capacitor-cordova-android-plugins module
        # sets sourceCompatibility/targetCompatibility to JavaVersion.VERSION_21
        # (android/capacitor-cordova-android-plugins/build.gradle) — JDK 17
        # fails with "invalid source release: 21" since javac can't target a
        # release newer than the JDK running it.
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android project with the fresh web build
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # TEMPORARY diagnostic (remove once the "cannot find symbol" investigation
      # is resolved): dumps what SDK platform actually landed on disk and
      # whether its android.jar contains the API-30 Window methods we expect.
      # Runs even if the build above failed.
      - name: Diagnose Android SDK platform
        if: always()
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK_DIR=$SDK_DIR"
          echo "--- platforms ---"
          ls -la "$SDK_DIR/platforms" 2>/dev/null || echo "(no platforms dir)"
          echo "--- build-tools ---"
          ls -la "$SDK_DIR/build-tools" 2>/dev/null || echo "(no build-tools dir)"
          echo "--- all android.jar files found ---"
          find "$SDK_DIR" -name "android.jar" 2>/dev/null
          # Target the EXACT jar compileSdk=36 actually uses, not just the
          # highest one present on the runner image (which includes preview
          # platforms like 37.x that aren't what :app compiles against).
          JAR="$SDK_DIR/platforms/android-36/android.jar"
          echo "compileSdk=36 android.jar: $JAR"
          if [ -f "$JAR" ]; then
            echo "--- javap: android.view.Window members matching decorFits/systemUiVisibility ---"
            javap -classpath "$JAR" android.view.Window 2>&1 | grep -i "decorFits\|systemUiVisibility\|class android.view.Window"
            echo "--- javap: android.view.View members matching SYSTEM_UI_FLAG_LAYOUT ---"
            javap -classpath "$JAR" android.view.View 2>&1 | grep -i "SYSTEM_UI_FLAG_LAYOUT"
          else
            echo "android-36/android.jar not found on disk"
          fi
          echo "--- androidx.core:core WindowCompat class actually on the compile classpath ---"
          find ~/.gradle /root/.gradle /home/runner/.gradle -path "*androidx.core/core*" -name "*.aar" -o -path "*androidx.core/core*" -name "*.jar" 2>/dev/null | grep -v sources

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: letthemeatcake-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
